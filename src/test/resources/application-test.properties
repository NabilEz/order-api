# src/test/resources/application-test.properties
#mvn test
#   Testcontainers fa partire un container postgres:16-alpine temporaneo
#   Spring si connette a quel container (URL dinamico via @DynamicPropertySource)
#   i test girano contro PostgreSQL reale
#   i test finiscono  container eliminato automaticamente

# Testcontainers gestisce URL, username e password dinamicamente
# Spring Boot 3.1+ supporta il datasource dinamico via @DynamicPropertySource

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT per i test
jwt.secret=chiave-segreta-di-test-lunga-almeno-32-caratteri
jwt.expiration-seconds=900